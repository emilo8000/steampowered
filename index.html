<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 400px;
            padding: 30px;
            background: #1f2937;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,.4);
        }

        h1 {
            color: white;
            text-align: center;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #5865F2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4752c4;
        }

        #status {
            color: #9ca3af;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Formularz testowy</h1>

    <input
        id="message"
        type="text"
        placeholder="Wpisz wiadomość..."
    >

    <button onclick="sendMessage()">
        Wyślij
    </button>

    <div id="status"></div>
</div>

<script>
    // WSTAW TUTAJ SWÓJ WEBHOOK
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1537889111510229024/q2qoHjlna-hy-k6C1mraSiecdpLKbqQfS3urkWNnZ00ggpP9Oqi9LF4e3ZTAcZq3W1aP";

    async function sendMessage() {
        const input = document.getElementById("message");
        const status = document.getElementById("status");

        const text = input.value.trim();

        if (!text) {
            status.textContent = "Wpisz coś najpierw.";
            return;
        }

        try {
            const response = await fetch(WEBHOOK_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    content: text
                })
            });

            if (!response.ok) {
                throw new Error("Błąd wysyłania");
            }

            status.textContent = "Wysłano!";
            input.value = "";

        } catch (error) {
            console.error(error);
            status.textContent = "Nie udało się wysłać wiadomości.";
        }
    }
</script>

</body>
</html>
